<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal de alumnos · WM Studios</title>
<meta name="description" content="Material de apoyo de tus clases en WM Studios.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Portal de alumnos · WM Studios">
<meta property="og:description" content="Entra con tu correo y tu clave, o con Google, y mira el material de tus clases.">
<meta property="og:image" content="https://wmstudio.academy/img/clase.jpg">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--raised:#161616;--raised2:#1F1F1F;--line:#2E2E2E;--ink:#F4F2EE;--muted:#A3A3A3;--gold:#C49A6C;--gold-ink:#0A0A0A;--display:'Archivo','Arial Black',Arial,sans-serif;--text:'Inter',system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 28px;border-bottom:1px solid var(--line)}
header img{height:28px;width:auto;display:block}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
h1,h2,h3{font-family:var(--display);font-stretch:125%;text-transform:uppercase;margin:0;font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(32px,7vw,52px);line-height:.98}
h2{font-size:clamp(22px,4.4vw,30px);line-height:1.05}
.muted{color:var(--muted)}
button,.btn{font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--line);background:var(--raised2);color:var(--ink);padding:12px 20px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
button:disabled{opacity:.55;cursor:default}
button.link{background:none;border:0;color:var(--muted);padding:8px 0;min-height:0;font-weight:600}
button.link:hover{color:var(--ink)}
input{font:inherit;font-size:18px;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{font-size:14px;font-weight:600;color:var(--muted)}
.login{max-width:440px;margin:48px auto 0;display:flex;flex-direction:column;gap:20px}
.login form{display:flex;flex-direction:column;gap:12px}
.code{letter-spacing:.4em;font-size:28px;font-weight:700;text-align:center}
.pw{position:relative}.pw input{padding-right:84px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px;padding:6px 12px;font-size:13px;background:none;border:0;color:var(--muted)}
.pw .eye:hover{color:var(--ink)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbox{min-height:44px;display:flex;justify-content:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.acct{display:flex;align-items:center;gap:10px;min-width:0}
#who{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out-btn{min-height:40px;padding:8px 16px;font-size:14px;border-color:rgba(196,154,108,.55);color:var(--ink);background:var(--raised2);white-space:nowrap}
.out-btn:hover{border-color:var(--gold);color:var(--gold)}
.out-btn svg{width:16px;height:16px;flex:none}
@media (max-width:520px){#who{display:none}}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding:14px 16px;border:1px solid rgba(196,154,108,.4);border-radius:14px;background:var(--raised)}
.note p{margin:0;font-size:14px;color:var(--muted)}.note b{color:var(--ink)}
.msg{min-height:22px;font-size:14px;margin:0}
.msg.err{color:#E8B4A0}
.hero{display:flex;flex-direction:column;gap:12px;padding:36px 0 8px}
.prog{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bar{height:8px;border-radius:99px;background:var(--raised2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.course{margin-top:40px;display:flex;flex-direction:column;gap:14px}
.course-head{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.cls{background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cls summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}
.cls summary::-webkit-details-marker{display:none}
.cls .n{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:26px;color:var(--gold);line-height:1}
.cls .t{font-weight:600}
.cls .chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cls .chip.has{color:var(--gold)}
.cls[open] summary{border-bottom:1px solid var(--line)}
.cls .body{padding:18px;display:flex;flex-direction:column;gap:18px}
.cls.locked{opacity:.5}
.cls.locked summary{cursor:default}
.mats{display:flex;flex-direction:column;gap:8px}
.mat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--raised2);text-decoration:none;color:var(--ink);font-weight:600}
.mat:hover{background:#262626}
.mat .ic{flex:none;min-width:34px;padding:0 4px;width:auto;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;letter-spacing:.04em}
.mat span:last-child{min-width:0;overflow-wrap:anywhere}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
ul.pts{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
ul.pts b{color:var(--ink);font-weight:600}
.box{background:var(--raised2);border-radius:12px;padding:14px 16px;color:var(--muted)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:r .8s linear infinite;margin:64px auto}
@keyframes r{to{transform:rotate(1turn)}}
@media (max-width:520px){.cls summary{grid-template-columns:40px minmax(0,1fr)}.cls .chip{grid-column:2}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../img/wm-logo-blanco.png" alt="WM Studios"><div class="acct"><span id="who"></span><span id="hbtn"></span></div></header>
  <main id="app"><div class="spin" role="status" aria-label="Cargando"></div></main>
  <footer><span>WM Studios · Av. 20 con 5 de Julio, Maracaibo · <a href="../privacidad/">Privacidad</a></span><span id="out"></span></footer>
</div>
<script src="config.js"></script>
<script>
const API_URL=window.WM_API||'PEGA_';

const app=document.getElementById('app');
const KEY='wm-portal';
let ses=null;try{ses=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(v){ses=v;try{v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY)}catch(e){}}
function matHref(u){u=String(u||'');return u.startsWith('doc:')?'ver/index.html#'+encodeURIComponent(u.slice(4)):safeUrl(u)}
function matAttrs(u){return String(u||'').startsWith('doc:')?'':' target="_blank" rel="noopener"'}
function kindOf(u){return String(u||'').startsWith('doc:')?'GUÍA':kind(u)}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:'#'}catch(e){return '#'}}

async function api(action,body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})});
  if(!r.ok)throw new Error('red');return r.json();
}

/* ---------- entrar ---------- */
const GCID=window.WM_GOOGLE_CLIENT_ID||'';
function clearTop(){document.getElementById('who').textContent='';document.getElementById('out').innerHTML='';document.getElementById('hbtn').innerHTML=''}
function pwField(id,label,ac){return `<label for="${id}">${label}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}" required><button class="eye" type="button" data-eye="${id}">Mostrar</button></div>`}
function wireEyes(){app.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const sh=i.type==='password';i.type=sh?'text':'password';b.textContent=sh?'Ocultar':'Mostrar'})}
function err(m,t){m.className='msg err';m.textContent=t}
function busy(b,on,txt){b.disabled=on;b.textContent=txt}
const validEmail=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
function passProblem(a,b){if(a.length<8)return 'La clave debe tener al menos 8 caracteres.';if(!/[A-Za-z]/.test(a)||!/[0-9]/.test(a))return 'Usa letras y números en tu clave.';if(a!==b)return 'Las dos claves no coinciden.';return ''}

/* Google: carga su script solo si hay ID de cliente. */
let gisP=null;
function gis(){if(!GCID)return Promise.reject();if(!gisP)gisP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});return gisP}
function googleButton(box,m){
  gis().then(()=>{google.accounts.id.initialize({client_id:GCID,callback:async res=>{m.className='msg';m.textContent='Entrando con Google…';
      try{const r=await api('google',{credential:res.credential});if(r.ok){save({email:r.email,token:r.token});load()}else err(m,r.error)}catch(x){err(m,'No hay conexión. Inténtalo de nuevo.')}},
    ux_mode:'popup',cancel_on_tap_outside:true});
    google.accounts.id.renderButton(box,{theme:'filled_black',size:'large',shape:'pill',text:'signin_with',locale:'es',width:Math.min(400,box.clientWidth||320)})})
  .catch(()=>{box.innerHTML='<p class="hint">No se pudo cargar el botón de Google. Entra con tu correo y tu clave.</p>'})}

function viewLogin(msg,email){
  clearTop();
  app.innerHTML=`<section class="login">
    <div><p class="eyebrow">Portal de alumnos</p><h1 style="margin-top:10px">Tu material de clase</h1></div>
    ${GCID?`<div class="gbox" id="gb"></div><p class="or">o con tu correo</p>`:''}
    <form id="f1" novalidate><label for="em">Correo</label><input id="em" type="email" autocomplete="email" inputmode="email" required value="${esc(email||'')}" placeholder="tucorreo@gmail.com">
    ${pwField('pw','Clave','current-password')}
    <button class="primary" id="b1" type="submit">Entrar</button><p class="msg ${msg?'err':''}" id="m1" role="alert">${esc(msg||'')}</p>
    <p class="hint">¿Primera vez? Usa la clave temporal que te dio la academia; al entrar crearás la tuya.</p>
    <button class="link" type="button" id="fg">¿Olvidaste tu clave?</button></form></section>`;
  const f=document.getElementById('f1'),em=document.getElementById('em'),pw=document.getElementById('pw'),b=document.getElementById('b1'),m=document.getElementById('m1');
  wireEyes();(email?pw:em).focus();
  if(GCID)googleButton(document.getElementById('gb'),m);
  document.getElementById('fg').onclick=()=>viewRecover(em.value.trim().toLowerCase());
  f.onsubmit=async ev=>{ev.preventDefault();const e=em.value.trim().toLowerCase();if(!validEmail(e))return err(m,'Escribe un correo válido.');if(!pw.value)return err(m,'Escribe tu clave.');
    busy(b,true,'Entrando…');m.textContent='';
    try{const r=await api('login',{email:e,password:pw.value});
      if(r.ok){save({email:e,token:r.token});r.mustChange?viewSetPass('must'):load();return}
      if(r.error==='Acción desconocida.'){legacyEmail(e);return}   /* servidor todavía sin actualizar */
      err(m,r.error);busy(b,false,'Entrar');pw.select()}
    catch(x){err(m,'No hay conexión. Inténtalo de nuevo.');busy(b,false,'Entrar')}};
}

/* Recuperar: código al correo + clave nueva. */
function viewRecover(email){
  clearTop();
  app.innerHTML=`<section class="login">
    <div><p class="eyebrow">Recuperar acceso</p><h1 style="margin-top:10px">Crea una clave nueva</h1></div>
    <p class="muted" style="margin:0">Te enviaremos un código de 6 dígitos al correo con el que te inscribiste.</p>
    <form id="f1" novalidate><label for="em">Correo</label><input id="em" type="email" autocomplete="email" inputmode="email" required value="${esc(email||'')}" placeholder="tucorreo@gmail.com">
    <button class="primary" id="b1" type="submit">Enviarme el código</button><p class="msg" id="m1" role="alert"></p>
    <button class="link" type="button" id="bk">Volver a entrar con mi clave</button></form></section>`;
  const f=document.getElementById('f1'),em=document.getElementById('em'),b=document.getElementById('b1'),m=document.getElementById('m1');
  em.focus();document.getElementById('bk').onclick=()=>viewLogin('',em.value.trim().toLowerCase());
  f.onsubmit=async ev=>{ev.preventDefault();const e=em.value.trim().toLowerCase();if(!validEmail(e))return err(m,'Escribe un correo válido.');
    busy(b,true,'Enviando…');m.textContent='';
    try{const r=await api('pedirCodigo',{email:e});if(r.ok)viewRecoverCode(e);else{err(m,r.error);busy(b,false,'Enviarme el código')}}
    catch(x){err(m,'No hay conexión. Inténtalo de nuevo.');busy(b,false,'Enviarme el código')}};
}
function viewRecoverCode(email){
  app.innerHTML=`<section class="login">
    <div><p class="eyebrow">Revisa tu correo</p><h1 style="margin-top:10px">Código y clave nueva</h1></div>
    <p class="muted" style="margin:0">Enviamos el código a <b style="color:var(--ink)">${esc(email)}</b>. Vence en 10 minutos. Si no llega, revisa spam.</p>
    <form id="f2" novalidate><label for="cd">Código de 6 dígitos</label><input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
    ${pwField('p1','Clave nueva','new-password')}${pwField('p2','Repite la clave','new-password')}
    <p class="hint">Mínimo 8 caracteres, con letras y números.</p>
    <button class="primary" id="b2" type="submit">Guardar y entrar</button><p class="msg" id="m2" role="alert"></p>
    <button class="link" type="button" id="bk">Pedir otro código</button></form></section>`;
  const f=document.getElementById('f2'),cd=document.getElementById('cd'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),b=document.getElementById('b2'),m=document.getElementById('m2');
  wireEyes();cd.focus();cd.oninput=()=>{cd.value=cd.value.replace(/\D/g,'').slice(0,6);if(cd.value.length===6)p1.focus()};
  document.getElementById('bk').onclick=()=>viewRecover(email);
  f.onsubmit=async ev=>{ev.preventDefault();if(cd.value.length!==6)return err(m,'Escribe el código de 6 dígitos.');const pr=passProblem(p1.value,p2.value);if(pr)return err(m,pr);
    busy(b,true,'Guardando…');m.textContent='';
    try{const r=await api('recuperar',{email,code:cd.value,password:p1.value});if(r.ok){save({email,token:r.token});load()}else{err(m,r.error);busy(b,false,'Guardar y entrar')}}
    catch(x){err(m,'No hay conexión. Inténtalo de nuevo.');busy(b,false,'Guardar y entrar')}};
}

/* Crear o cambiar la clave con la sesión abierta. mode: 'must' (después de la clave temporal) u 'opt'. */
function viewSetPass(mode){
  clearTop();
  app.innerHTML=`<section class="login">
    <div><p class="eyebrow">${mode==='must'?'Último paso':'Tu clave'}</p><h1 style="margin-top:10px">${mode==='must'?'Crea tu propia clave':'Crea o cambia tu clave'}</h1></div>
    <p class="muted" style="margin:0">${mode==='must'?'Entraste con una clave temporal. Crea la tuya para seguir; la temporal dejará de funcionar.':'Con ella entras con tu correo, sin depender de Google.'}</p>
    <form id="f3" novalidate>${pwField('p1','Clave nueva','new-password')}${pwField('p2','Repite la clave','new-password')}
    <p class="hint">Mínimo 8 caracteres, con letras y números.</p>
    <button class="primary" id="b3" type="submit">Guardar clave</button><p class="msg" id="m3" role="alert"></p>
    ${mode==='must'?'':'<button class="link" type="button" id="bk">Volver a mi material</button>'}</form></section>`;
  const f=document.getElementById('f3'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),b=document.getElementById('b3'),m=document.getElementById('m3');
  wireEyes();p1.focus();const bk=document.getElementById('bk');if(bk)bk.onclick=load;
  f.onsubmit=async ev=>{ev.preventDefault();const pr=passProblem(p1.value,p2.value);if(pr)return err(m,pr);
    busy(b,true,'Guardando…');m.textContent='';
    try{const r=await api('cambiarClave',{email:ses.email,token:ses.token,password:p1.value});
      if(r.ok){load();return}if(r.auth===false){save(null);viewLogin(r.error,ses&&ses.email);return}err(m,r.error);busy(b,false,'Guardar clave')}
    catch(x){err(m,'No hay conexión. Inténtalo de nuevo.');busy(b,false,'Guardar clave')}};
}

/* Entrada anterior con código (solo mientras el servidor no esté actualizado). */
function legacyEmail(email){
  clearTop();
  app.innerHTML=`<section class="login"><div><p class="eyebrow">Portal de alumnos</p><h1 style="margin-top:10px">Entra con un código</h1></div>
    <p class="muted" style="margin:0">Estamos actualizando el portal. Por ahora te enviaremos un código de 6 dígitos a tu correo.</p>
    <form id="f1" novalidate><label for="em">Correo</label><input id="em" type="email" autocomplete="email" inputmode="email" required value="${esc(email||'')}">
    <button class="primary" id="b1" type="submit">Enviarme el código</button><p class="msg" id="m1" role="alert"></p></form></section>`;
  const f=document.getElementById('f1'),em=document.getElementById('em'),b=document.getElementById('b1'),m=document.getElementById('m1');
  f.onsubmit=async ev=>{ev.preventDefault();const e=em.value.trim().toLowerCase();if(!validEmail(e))return err(m,'Escribe un correo válido.');busy(b,true,'Enviando…');
    try{const r=await api('pedirCodigo',{email:e});if(r.ok)legacyCode(e);else{err(m,r.error);busy(b,false,'Enviarme el código')}}catch(x){err(m,'No hay conexión.');busy(b,false,'Enviarme el código')}};
}
function legacyCode(email){
  app.innerHTML=`<section class="login"><div><p class="eyebrow">Revisa tu correo</p><h1 style="margin-top:10px">Escribe el código</h1></div>
    <form id="f2" novalidate><label for="cd">Código de 6 dígitos</label><input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    <button class="primary" id="b2" type="submit">Entrar</button><p class="msg" id="m2" role="alert"></p></form></section>`;
  const f=document.getElementById('f2'),cd=document.getElementById('cd'),b=document.getElementById('b2'),m=document.getElementById('m2');cd.focus();
  f.onsubmit=async ev=>{ev.preventDefault();busy(b,true,'Entrando…');
    try{const r=await api('entrar',{email,code:cd.value.trim()});if(r.ok){save({email,token:r.token});load()}else{err(m,r.error);busy(b,false,'Entrar')}}catch(x){err(m,'No hay conexión.');busy(b,false,'Entrar')}};
}

/* ---------- contenido ---------- */
function kind(u){u=String(u).toLowerCase();if(/youtu\.?be|vimeo/.test(u))return 'VID';if(/\.pdf($|\?)/.test(u))return 'PDF';if(/\.(mp3|wav|m4a)($|\?)/.test(u))return 'AUD';if(/docs\.google|drive\.google/.test(u))return 'DOC';return 'WEB'}
function lead(p){const m=String(p).match(/^([^:]{2,40}):\s*(.+)$/);return m?`<b>${esc(m[1])}:</b> ${esc(m[2])}`:esc(p)}
function clsCard(c,open){
  const num=String(c.n).padStart(2,'0');
  if(c.locked)return `<div class="cls locked"><summary aria-disabled="true"><span class="n">${num}</span><span class="t">${esc(c.title)}</span><span class="chip">Próximamente</span></summary></div>`;
  const ms=c.material||[];
  return `<details class="cls"${open?' open':''}><summary><span class="n">${num}</span><span class="t">${esc(c.title)}</span><span class="chip ${ms.length?'has':''}">${ms.length?ms.length+(ms.length>1?' materiales':' material'):'Vista'}</span></summary>
  <div class="body">
    ${ms.length?`<div><p class="lbl">Material de apoyo</p><div class="mats">${ms.map(m=>`<a class="mat" href="${esc(matHref(m.url))}"${matAttrs(m.url)}><span class="ic">${kindOf(m.url)}</span><span>${esc(m.title)}</span></a>`).join('')}</div></div>`:''}
    ${(c.points||[]).length?`<div><p class="lbl">Lo que vimos</p><ul class="pts">${c.points.map(p=>`<li>${lead(p)}</li>`).join('')}</ul></div>`:''}
    ${c.homework?`<div><p class="lbl">Tarea</p><div class="box">${esc(c.homework)}</div></div>`:''}
  </div></details>`;
}
function viewPortal(d){
  setTimeout(()=>{const mk=document.getElementById('mk');if(mk)mk.onclick=()=>viewSetPass('opt')},0);
  const first=String(d.name||'').split(' ')[0];
  document.getElementById('who').textContent=d.name||'';
  document.getElementById('out').innerHTML=(d.hasPassword===undefined?'':'<button class="link" id="cp" style="margin-right:18px">'+(d.hasPassword?'Cambiar clave':'Crear clave')+'</button>')+'<button class="link" id="lo2">Cerrar sesión</button>';
  document.getElementById('hbtn').innerHTML='<button class="out-btn" id="lo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Cerrar sesión</button>';
  const logout=async()=>{const s=ses;save(null);viewLogin('',s&&s.email);try{await api('salir',s)}catch(e){}};
  document.getElementById('lo').onclick=logout;document.getElementById('lo2').onclick=logout;
  const cpb=document.getElementById('cp');if(cpb)cpb.onclick=()=>viewSetPass('opt');
  const courses=d.courses||[];
  app.innerHTML=`<section class="hero"><p class="eyebrow">Portal de alumnos</p><h1>Hola, ${esc(first)}</h1>
    <p class="muted" style="margin:0">${d.admin?'Vista de administrador: ves todos los cursos y todo el material, tal como lo verá cada alumno al avanzar.':'Aquí está el material de las clases que ya viste. Cada clase nueva se abre después de verla con tu profesor.'}</p></section>`+
    courses.map(c=>{const pct=c.total?Math.round(c.hasta/c.total*100):0;
      return `<section class="course"><div class="course-head"><p class="eyebrow">${d.admin?'Curso':'Tu curso'}</p><h2>${esc(c.course)}</h2>
        <div class="prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${c.total}" aria-valuenow="${c.hasta}" aria-label="Avance del curso"><i style="width:${pct}%"></i></div><span class="muted" style="font-size:14px">${c.hasta} de ${c.total} clases vistas</span></div></div>
        ${(c.material||[]).length?`<div class="cls"><div class="body"><p class="lbl">Material del curso</p><div class="mats">${c.material.map(m=>`<a class="mat" href="${esc(matHref(m.url))}"${matAttrs(m.url)}><span class="ic">${kindOf(m.url)}</span><span>${esc(m.title)}</span></a>`).join('')}</div></div></div>`:''}
        ${c.hasta?'':'<div class="box">El material de cada clase aparecerá aquí después de verla.</div>'}
        ${c.classes.map(x=>clsCard(x,x.n===c.hasta)).join('')}</section>`}).join('')+
    (d.hasPassword===false?`<div class="note"><p><b>Entraste con Google.</b> Si quieres, crea una clave para entrar también con tu correo.</p><button id="mk">Crear clave</button></div>`:'')+
    (d.updatedAt?`<p class="muted" style="font-size:13px;margin-top:28px">Actualizado el ${esc(new Date(d.updatedAt).toLocaleDateString('es-VE',{day:'numeric',month:'long'}))}.</p>`:'');
}
async function load(){
  if(!ses||!ses.token){viewLogin();return}
  app.innerHTML='<div class="spin" role="status" aria-label="Cargando"></div>';
  try{const r=await api('portal',ses);if(r.ok)viewPortal(r);else if(r.mustChange)viewSetPass('must');else{if(r.auth===false)save(null);viewLogin(r.error,ses&&ses.email)}}
  catch(e){app.innerHTML='<div class="empty"><p>No pudimos conectar. Revisa tu internet.</p><button id="rt">Reintentar</button></div>';document.getElementById('rt').onclick=load}
}
if(API_URL.startsWith('PEGA_'))app.innerHTML='<div class="empty">El portal aún no está conectado.</div>';else load();
</script>
</body>
</html>
